name: voicechat_broadcast
version: '${version}'
main: de.maxhenkel.voicechat_broadcast.VoicechatBroadcast
api-version: '${bukkit_api_version}'
prefix: voicechat_broadcast
authors: [ "Max Henkel", "Typoplays" ]
description: An updated broadcast addon for Simple Voice Chat
website: https://github.com/TYPOPLAYS/simple-voicechat-broadcast-enhanced
permissions:
  voicechat_broadcast.broadcast:
    description: Allows a player to broadcast their voice
    default: op
depend: [ voicechat ]